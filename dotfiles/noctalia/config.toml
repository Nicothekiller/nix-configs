# Noctalia curated config — base layer (~/.config/noctalia/).
# GUI changes land in ~/.local/state/noctalia/settings.toml and win over this file.

[shell]
polkit_agent = true

[wallpaper]
enabled = true
directory = "/home/nic/.config/wallpapers"
fill_mode = "crop"

[wallpaper.automation]
enabled = true
interval_seconds = 1800
order = "random"
recursive = true

[theme]
mode = "dark"
source = "wallpaper"

[theme.templates]
enable_builtin_templates = true
builtin_ids = [
  "gtk3",
  "gtk4",
  "qt",
  "kcolorscheme",
  "hyprland",
]
enable_community_templates = false

[bar.default]
position = "top"
radius = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 0
radius_bottom_right = 0
concave_edge_corners = false
margin_ends = 0
margin_edge = 0

# NOTE: plugin sources and the enabled list are intentionally NOT managed
# here. Once the Settings GUI (or IPC) writes a [plugins] table to
# ~/.local/state/noctalia/settings.toml, that override layer wins per key
# and arrays replace rather than merge -- so base-layer [[plugins.source]]
# entries never surface. Manage plugins via Settings -> Plugins instead
# (e.g. git source https://github.com/Nicothekiller/noctalia-monitor-manager
# for nic/monitors).
